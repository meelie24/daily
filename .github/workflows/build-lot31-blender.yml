name: Build Lot 31 Realistic Blender House

on:
  push:
    branches:
      - lot31-blender-build
    paths:
      - 'lot31_blender/**'
      - '.github/workflows/build-lot31-blender.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lot31-blender-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Blender build and interactive export
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      BLENDER_VERSION: '5.2.1'
      LIBGL_ALWAYS_SOFTWARE: '1'
      MESA_GL_VERSION_OVERRIDE: '4.5'

    steps:
      - name: Check out project branch
        uses: actions/checkout@v4

      - name: Extract committed source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat lot31_blender/source_parts/source_bundle.b64.* | base64 --decode > /tmp/lot31-source.tar.gz
          tar -xzf /tmp/lot31-source.tar.gz
          test -s lot31_blender/build_lot31.py

      - name: Prepare fast and stable interactive export
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('lot31_blender/build_lot31.py')
          text = path.read_text(encoding='utf-8')

          # The interactive .blend and .glb are the actual deliverables. Skip
          # CPU-only still renders in CI so the working model exports first.
          text, count = re.subn(
              r'bpy\.ops\.render\.render\s*\([^\n]*\)',
              "print('[LOT31] Still preview skipped in CI; exporting interactive model first')",
              text,
          )
          print(f'Disabled {count} Blender still-render call(s).')

          text = text.replace("scene.render.resolution_x = 1920", "scene.render.resolution_x = 640")
          text = text.replace("scene.render.resolution_y = 1080", "scene.render.resolution_y = 360")
          text = text.replace("scene.cycles.samples = 128", "scene.cycles.samples = 8")
          text = text.replace("scene.cycles.samples = 64", "scene.cycles.samples = 8")

          # One imported real asset retains stale KHR_materials_variants data.
          # Clear only that optional metadata immediately before the GLB export.
          marker = 'bpy.ops.export_scene.gltf('
          sanitizer = textwrap.dedent('''\
          print('[LOT31] Sanitizing optional glTF material-variant metadata')
          try:
              addon = bpy.context.preferences.addons.get('io_scene_gltf2')
              if addon is not None and hasattr(addon.preferences, 'KHR_materials_variants_ui'):
                  addon.preferences.KHR_materials_variants_ui = False
          except Exception as exc:
              print(f'[LOT31] Variant preference warning: {exc}')

          for mesh_data in bpy.data.meshes:
              for attr_name in ('gltf2_variant_mesh_data', 'gltf2_variant_default_materials'):
                  variant_collection = getattr(mesh_data, attr_name, None)
                  if variant_collection is None:
                      continue
                  try:
                      variant_collection.clear()
                  except Exception:
                      try:
                          while len(variant_collection):
                              variant_collection.remove(len(variant_collection) - 1)
                      except Exception as exc:
                          print(f'[LOT31] Could not clear {mesh_data.name}.{attr_name}: {exc}')

          for scene_data in bpy.data.scenes:
              variant_collection = getattr(scene_data, 'gltf2_KHR_materials_variants_variants', None)
              if variant_collection is not None:
                  try:
                      variant_collection.clear()
                  except Exception:
                      try:
                          while len(variant_collection):
                              variant_collection.remove(len(variant_collection) - 1)
                      except Exception as exc:
                          print(f'[LOT31] Could not clear scene variants: {exc}')
          ''').rstrip()

          marker_index = text.find(marker)
          if marker_index < 0:
              raise SystemExit('GLB export call was not found in build_lot31.py')
          line_start = text.rfind('\n', 0, marker_index) + 1
          export_indent = text[line_start:marker_index]
          if export_indent.strip():
              raise SystemExit(f'Unexpected text before GLB export call: {export_indent!r}')
          indented_sanitizer = '\n'.join(
              export_indent + line if line else ''
              for line in sanitizer.splitlines()
          )
          text = text[:line_start] + indented_sanitizer + '\n' + text[line_start:]

          # Compile before launching Blender so indentation/syntax mistakes fail
          # here rather than masquerading as a successful Blender process.
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates xz-utils zip unzip xvfb \
            libx11-6 libxext6 libxrender1 libxi6 libxxf86vm1 libxfixes3 \
            libxkbcommon0 libxrandr2 libxcursor1 libsm6 \
            libegl1 libgl1 libgl1-mesa-dri libwayland-client0 libwayland-egl1 \
            libtbb12 libjemalloc2

      - name: Download and verify official Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .blender
          archive="blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          base="https://download.blender.org/release/Blender5.2"
          curl --fail --location --retry 5 --retry-all-errors -o blender.tar.xz "$base/$archive"
          curl --fail --location --retry 5 --retry-all-errors -o blender.sha256 "$base/blender-${BLENDER_VERSION}.sha256"
          expected="$(awk -v f="$archive" '$2==f || $2==("*" f) {print $1; exit}' blender.sha256)"
          test -n "$expected"
          echo "$expected  blender.tar.xz" | sha256sum --check -
          tar -xf blender.tar.xz -C .blender --strip-components=1
          ./.blender/blender --version

      - name: Download licensed real 3D assets
        run: python3 lot31_blender/download_assets.py

      - name: Vendor offline viewer runtime
        shell: bash
        run: |
          set -euo pipefail
          base="lot31_blender/viewer/vendor"
          mkdir -p "$base/examples/jsm/controls" "$base/examples/jsm/loaders" "$base/examples/jsm/utils"
          curl --fail --location --retry 5 -o "$base/three.module.js" "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
          curl --fail --location --retry 5 -o "$base/examples/jsm/controls/OrbitControls.js" "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js"
          curl --fail --location --retry 5 -o "$base/examples/jsm/controls/PointerLockControls.js" "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/PointerLockControls.js"
          curl --fail --location --retry 5 -o "$base/examples/jsm/loaders/GLTFLoader.js" "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js"
          curl --fail --location --retry 5 -o "$base/examples/jsm/loaders/RGBELoader.js" "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/RGBELoader.js"
          curl --fail --location --retry 5 -o "$base/examples/jsm/utils/BufferGeometryUtils.js" "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/utils/BufferGeometryUtils.js"

      - name: Build house in Blender and export GLB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./.blender/blender -b --factory-startup \
            -P lot31_blender/build_lot31.py -- \
            --project-root "$GITHUB_WORKSPACE/lot31_blender" \
            --output "$GITHUB_WORKSPACE/output"

      - name: Validate deliverables
        shell: bash
        run: |
          set -euo pipefail
          test -s output/Lot31_Realistic_House.blend
          test -s output/viewer/Lot31_Realistic_House.glb
          test -s output/viewer/index.html
          test -s output/viewer/viewer.js
          test -s output/BUILD_REPORT.json
          test "$(stat -c%s output/Lot31_Realistic_House.blend)" -gt 1000000
          test "$(stat -c%s output/viewer/Lot31_Realistic_House.glb)" -gt 1000000
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('output/BUILD_REPORT.json').read_text())
          assert report['lot_area_sqft'] == 8031
          assert report['bar_stools'] == 3
          assert report['approx_total_sqft'] >= 4000
          assert len(report['real_assets_imported']) >= 4
          print(json.dumps(report, indent=2))
          PY

      - name: Package model, viewer and source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/source output/previews
          cp lot31_blender/build_lot31.py output/source/
          cp lot31_blender/download_assets.py output/source/
          cp lot31_blender/BUILD_BRIEF.md output/
          cp lot31_blender/README.md output/README.md
          cp lot31_blender/README.md output/viewer/README.md
          (
            cd output
            zip -1 -r Lot31_Blender_Realistic_Interactive_Package.zip \
              Lot31_Realistic_House.blend \
              viewer \
              previews \
              source \
              README.md \
              BUILD_BRIEF.md \
              BUILD_REPORT.json \
              ASSET_CREDITS.md \
              asset_license_notices
          )
          ls -lah output output/viewer

      - name: Upload finished Blender package
        uses: actions/upload-artifact@v4
        with:
          name: lot31-blender-realistic-package
          path: |
            output/Lot31_Blender_Realistic_Interactive_Package.zip
            output/BUILD_REPORT.json
          if-no-files-found: error
          retention-days: 14
