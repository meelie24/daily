}
window.setColor=i=>{S.car.color=i;save();render();};
window.setBody=i=>{S.car.body=i;save();render();};
window.startDriving=()=>{render(true);acquireWake();sayHey();};

/* ============ CARS ============ */
function ringHTML(n){
  const r=54,c=2*Math.PI*r,f=Math.min(1,n/8);
  return `<div class="ring">
   <svg viewBox="0 0 140 140" width="150" height="150">
     <circle class="rbg" cx="70" cy="70" r="${r}"/>
     <circle class="rfg" cx="70" cy="70" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${(c*(1-f)).toFixed(1)}"/>
   </svg>
   <div class="rnum"><b>${n}</b><span class="mono">in range</span></div></div>`;
}
function rCars(){
  const list=nearby(),dup=dupCombos();
  const closest=list.length?band(list[0].d)||'in range':'—';
  return `<div class="ghead">
    <div class="hrow">${statusChip()}<span class="mono" style="color:var(--txt-3)">${esc(rangeTxt())}</span></div>
    <h1 class="disp" style="margin-top:14px">Around <em>you</em></h1>
  </div>
  ${ringHTML(list.length)}
  <div class="bento" style="margin-top:18px">
    <div class="cell"><span class="lbl">Closest</span><b style="font-size:1.15rem">${esc(closest)}</b></div>
    <div class="cell accent"><span class="lbl">Range</span><b>${esc(rangeTxt())}</b><small>tap You to change</small></div>
    ${S.car.color>=0?`<div class="cell wide"><span class="lbl">You are</span>
      <div style="display:flex;align-items:center;gap:12px">${swatch(S.car.color)}
        <div><b style="font-size:1.1rem">${esc(COLORS[S.car.color][0]+' '+BODIES[S.car.body])}</b>
        <small>${S.lane.trim()?(inMeet()?'':'shared code · ')+esc(laneLabel()):myCell()?'cell '+esc(myCell()):'no fix yet'}</small></div></div></div>`:''}
  </div>
  ${list.length?list.map(p=>`<div class="card" style="padding:15px 17px">
    <div style="display:flex;align-items:center;gap:12px">${swatch(p.c)}
      <div style="flex:1;min-width:0"><b style="font-size:.94rem;letter-spacing:-.02em">${esc(label(p.id,p.c,p.b,dup))}</b>
        <small class="mono" style="display:block;color:var(--txt-info);margin-top:3px">${esc(band(p.d)||'in range')}</small></div>
      <button class="chip" style="min-height:44px;padding:11px 18px;font-size:.78rem" data-mute="${esc(p.id)}" aria-pressed="${MUTED.has(p.id)}">${MUTED.has(p.id)?'Unmute':'Mute'}</button>
    </div></div>`).join('')
   :`<div class="empty">${connState==='offline'?'You’re offline. Lane can’t see any cars until you’re back in signal.'
      :linkVerified()?`<b style="color:var(--txt)">You’re on the air, nobody else yet.</b><br>Lane won’t invent traffic that isn’t there. Pull someone in, or widen your range.${inviteBtn}${S.radius<2000&&!S.lane.trim()?widenBtn:''}${meetCard()}`
      :'Lane needs another car with the app open and a signal. It won’t invent traffic that isn’t there.'}</div>`}
  <p class="note">Muting lasts for this session. Everyone’s ID changes every time they open the app, so a mute can’t follow someone across drives. That’s the trade for nobody being able to build a grudge against you either.</p>`;
}
function toggleMute(id){
  if(MUTED.has(id))MUTED.delete(id);else MUTED.add(id);
  render();
}
/* Delegated so the wire-controlled peer id rides a data- attribute and never
   enters an executable context, no matter what esc() does. */
view.addEventListener('click',e=>{
  const b=e.target.closest('[data-mute]');
  if(b){toggleMute(b.getAttribute('data-mute'));return;}
  const v=e.target.closest('[data-vn]');
  if(v){vnPlay(v.getAttribute('data-vn'));return;}
  const mm=e.target.closest('[data-menu]');
  if(mm)msgMenu(mm.getAttribute('data-menu'));
});

/* ============ YOU / SETTINGS ============ */
function rMe(){
  return `<div class="ghead">
    <div class="hrow">${statusChip()}<span class="mono" style="color:var(--txt-3)">v1</span></div>
    <h1 class="disp" style="margin-top:14px">Your <em>setup</em></h1>
  </div>
  <div class="card">
    <span class="lbl">Your car</span>
    <div style="display:flex;align-items:center;gap:13px">
      ${S.car.color>=0?swatch(S.car.color):'<span class="sw" style="background:var(--glass-2)"></span>'}
      <b style="flex:1;font-size:1.05rem;letter-spacing:-.03em">${S.car.color>=0?esc(COLORS[S.car.color][0]+' '+BODIES[S.car.body]):'Not set'}</b>
      <button class="chip" onclick="carSheet()">Change</button></div>
  </div>
  <div class="card">
    <span class="lbl">Range</span>
    <div class="chips">${[250,500,1000,2000].map(r=>
      `<button class="chip ${S.radius===r?'on':''}" aria-pressed="${S.radius===r}" onclick="setRadius(${r})">${r>=1000?(r/1000)+' km':r+' m'}</button>`).join('')}</div>
    <p class="note">How far a car can be and still show up. A light is 250 m. A motorway jam is 2 km.</p>
  </div>
  <div class="card">
    <span class="lbl">Driving</span>
    <div class="srow"><div class="k" id="lbl-parked">Parked
      <small>Unlocks typing when GPS can’t tell you’ve stopped. Switches itself off the moment you move, and never carries over to your next trip.</small></div>
      <button class="sw-t ${parked?'on':''}" role="switch" aria-checked="${parked}" aria-labelledby="lbl-parked" onclick="togParked()"><i></i></button></div>
    <div class="srow"><div class="k" id="lbl-sound">Sound<small>A blip when a message lands while you’re stopped.</small></div>
      <button class="sw-t ${S.sound?'on':''}" role="switch" aria-checked="${S.sound}" aria-labelledby="lbl-sound" onclick="togSound()"><i></i></button></div>
    ${'wakeLock'in navigator?`<div class="srow"><div class="k" id="lbl-awake">Keep screen awake
      <small>Stops your phone sleeping while Lane is open, so a glance at a light always works and the connection stays alive. Uses more battery.</small></div>
      <button class="sw-t ${S.keepAwake?'on':''}" role="switch" aria-checked="${S.keepAwake}" aria-labelledby="lbl-awake" onclick="togAwake()"><i></i></button></div>`:''}
    <div class="srow"><div class="k" id="lbl-listen">Read aloud${TTS_OK?'':' <span class="mono" style="color:var(--txt-3)">· not supported here</span>'}
      <small>Incoming messages get read out loud so you can keep your eyes up. ${IS_IOS?'On iPhone, keep Lane open with the screen on; it stops reading if you leave the app or the screen sleeps.':'Lets you keep your eyes on the road.'} Also on the Road screen’s <b>Listen</b> button.</small></div>
      <button class="sw-t ${S.listen?'on':''}" role="switch" aria-checked="${S.listen}" aria-labelledby="lbl-listen" ${TTS_OK?'':'disabled style="opacity:.4"'} onclick="toggleListen()"><i></i></button></div>
  </div>
  <div class="card">
    <span class="lbl">Shared code</span>
    <input type="text" placeholder="a word you both know" value="${esc(S.lane)}" onchange="setLane(this.value)">
    <p class="note">Leave it empty for the real traffic around you. Fill in a word and you’ll only see people who typed the same one, wherever they are. Location is ignored. It’s a channel name, not a password: pick something only your group would guess, and it still rides the public relay, so don’t treat it as secret. Handy for a convoy, or testing with a friend.</p>
    <button class="btn ghost sm" style="margin-top:10px" onclick="invite()">Share an invite link</button>
  </div>
  <div class="card">
    <span class="lbl">${esc(MEET.name)}</span>
    <p class="note" style="margin-top:0">${esc(meetLine(Date.now()))}</p>
    <p class="note">A shared code like any other, just one everybody knows. Proximity can’t get two people into an empty app at once, so this is the fallback: turn up at the same time instead of the same place.</p>
    ${inMeet()?`<button class="btn ghost sm" style="margin-top:12px" onclick="leaveMeet()">Leave the room</button>`
      :`<button class="btn ${meetWindow(Date.now()).open?'':'ghost'} sm" style="margin-top:12px" onclick="joinMeet()">${meetWindow(Date.now()).open?'Join it':'Join early and wait'}</button>`}
  </div>
  <div class="card">
    <span class="lbl">Relay</span>
    <div class="chips">${BROKERS.map((b,i)=>
      `<button class="chip ${!S.customBroker.trim()&&S.broker===i?'on':''}" aria-pressed="${!S.customBroker.trim()&&S.broker===i}" onclick="setBroker(${i})">${esc(b[0])}</button>`).join('')}</div>
    <input type="text" placeholder="or your own wss://host:port/mqtt" value="${esc(S.customBroker)}" onchange="setCustom(this.value)">
    <p class="note">Currently on <b>${esc(brokerName())}</b>. These are free public MQTT brokers, and <b>anyone can listen to them</b>. Lane rounds your position to about 55 m before sending and never sends a name, but don’t type anything here you’d mind a stranger reading. Point it at your own broker if you want it private.</p>
  </div>
  ${!isInstalled()&&(installEvt||IS_IOS)?`<div class="card">
    <span class="lbl">Add to home screen</span>
    <p class="note" style="margin-top:0">Opens like an app, launches faster, and keeps working the moment you next stop.</p>
    ${installEvt?`<button class="btn sm" style="margin-top:12px" onclick="doInstall()">Add Lane</button>`
      :`<p class="note" style="margin-top:10px"><b>Tap Share, then “Add to Home Screen.”</b></p>`}
  </div>`:''}
  <div class="card">
    <span class="lbl">Safety</span>
    <button class="btn ghost sm" onclick="showGate(true)">Read the safety notice again</button>
  </div>
  <div class="card danger-zone">
    <span class="lbl">Danger zone</span>
    <div class="srow"><div class="k">Reset everything<small>Clears your car, your settings and the safety notice. Messages were never saved in the first place.</small></div></div>
    <button class="btn danger sm" style="margin-top:12px" onclick="wipe()">Reset</button>
  </div>
  <p class="note" style="text-align:center;padding-bottom:8px">We never store what you say, but it travels over a public relay that anyone can listen to. Don’t send anything you’d mind a stranger reading. Messages fade after a few minutes.</p>`;
}
window.setRadius=r=>{S.radius=r;save();peers.clear();render();};
window.togParked=()=>{
  parked=!parked;
  if(parked){parkedAt=Date.now();toast('Parked mode on');}
  evalMotion();renderDock();render();
};
window.togSound=()=>{S.sound=!S.sound;save();render();};
window.togAwake=()=>{S.keepAwake=!S.keepAwake;save();if(S.keepAwake)acquireWake();else releaseWake();render();};
window.setLane=v=>{S.lane=v.trim().slice(0,24);save();peers.clear();msgs=[];lastCell=null;subbed=[];netStart();render();};
/* Joining remembers what you were on so leaving puts you back, rather than
   dumping you into proximity mode and quietly starting to broadcast a position
   you'd switched off. */
window.joinMeet=()=>{
  if(inMeet())return;
  S.prevLane=S.lane;
  setLane(MEET.code);
  toast(meetWindow(Date.now()).open?'You’re in '+MEET.name:'Waiting in '+MEET.name);
};
window.leaveMeet=()=>{
  const back=S.prevLane||'';
  S.prevLane='';
  setLane(back);
  toast(back?'Back on “'+back+'”':'Back to the cars around you');
};
/* Text-only refresh. A periodic render() would wipe a half-typed message and
   steal focus out of the You tab's inputs, so the view is only rebuilt on the
   one transition that actually changes what the buttons do. */
let meetWasOpen=meetWindow(Date.now()).open;
setInterval(()=>{
  const now=Date.now(),open=meetWindow(now).open;
  if(open!==meetWasOpen){meetWasOpen=open;render();return;}
  const line=meetLine(now);
  document.querySelectorAll('.meet-in').forEach(e=>{e.textContent=line;});
},30000);
window.setBroker=i=>{S.broker=i;S.customBroker='';save();retry=0;netStart();render();};
window.setCustom=v=>{S.customBroker=v.trim().slice(0,200);save();retry=0;netStart();render();};
window.carSheet=()=>{
  openSheet(`<h3>Your car</h3>
   <p style="font-size:.85rem;color:var(--txt-2);margin-bottom:16px">The only thing anyone sees.</p>
   <span class="lbl">Colour</span>${swatchGrid('setColor2')}
   <div style="height:18px"></div>
   <span class="lbl">Shape</span>${bodyChips('setBody2')}`);
};
window.setColor2=i=>{S.car.color=i;save();carSheet();render();sayHey();};
window.setBody2=i=>{S.car.body=i;save();carSheet();render();sayHey();};
window.netSheet=()=>{
  const c=myCell();
  openSheet(`<h3>Connection</h3>
   <div class="srow"><div class="k">Relay</div><b class="mono" style="color:var(--lime)">${esc(brokerName())}</b></div>
   <div class="srow"><div class="k">Status</div><b class="mono">${connState==='live'?'Connected':connState==='wait'?'Linking':'Offline'}</b></div>
   <div class="srow"><div class="k">Location</div><b class="mono">${gpsErr?esc(gpsErr):pos?'±'+Math.round(pos.acc)+' m':'waiting'}</b></div>
   <div class="srow"><div class="k">${inMeet()?'Room':S.lane.trim()?'Shared code':'Area'}</div><b class="mono">${S.lane.trim()?esc(laneLabel()):c?esc(c):'—'}</b></div>
   <div class="srow"><div class="k">Cars in range</div><b class="mono">${nearby().length}</b></div>
   <p class="note">Lane groups people by a map square about 4 km across, then only shows you the ones inside your range setting.</p>
   <button class="btn ghost sm" style="margin-top:14px" onclick="closeSheet();retry=0;netStart();toast('Reconnecting…')">Reconnect</button>`);
};
window.wipe=()=>{
  openSheet(`<h3>Reset everything?</h3>
   <p style="font-size:.87rem;color:var(--txt-2);margin:10px 0 18px">Clears your car, your settings and the safety notice. Messages were never saved in the first place.</p>
   <button class="btn danger" onclick="doWipe()">Reset</button>
   <button class="btn ghost" style="margin-top:10px" onclick="closeSheet()">Keep it</button>`);
};
window.doWipe=()=>{
  try{localStorage.removeItem(KEY);}catch(e){}
  stopSpeech();quiet=false;
  S=blank();msgs=[];peers.clear();MUTED.clear();closeSheet();onbStep=0;showGate();render(true);
};

/* ============ ONBOARDING ============ */
/* Three steps, one question each. Step 1 has no "skip" on purpose, a skippable
   safety notice is not a safety notice. */
const GATE_V=1;
let onbStep=0;
function showGate(again){
  const g=document.getElementById('gate');
  g.innerHTML=`<div class="in">${again?gateOnly():onbStepHTML()}</div>`;
  g.classList.add('show');
  g.scrollTop=0;
}
function stepBar(){
  return `<div class="steps">${[0,1,2].map(i=>`<i class="${i<=onbStep?'on':''}"></i>`).join('')}</div>
  <span class="mono" style="color:var(--txt-3)">Step ${onbStep+1} of 3</span>`;
}
function safetyBody(){
  return `<h1>Before you <em class="disp" style="font-style:italic">drive</em></h1>
   <p><b style="color:var(--txt)">Use this when you’re stopped, not when you’re moving.</b></p>
   <p>Using a phone while driving is illegal in most places, including while you’re sat at a red light in the UK, France, Germany and most US states. This app doesn’t change that, so check your own local law.</p>
   <p>Reading or typing while driving roughly doubles your crash risk, and your attention doesn’t fully come back for up to 27 seconds afterwards.</p>
   <ol>
    <li><b>Lane locks itself when you’re moving,</b> but it can get that wrong. You’re still the one driving.</li>
    <li><b>Everyone around you can see your car,</b> so assume they know which message was yours.</li>
    <li><b>It’s public and it doesn’t stick around.</b> Messages go over a shared relay that anyone can listen to, and nothing is stored. They fade after a few minutes.</li>
    <li><b>If someone gets under your skin, put the phone down.</b> Nobody wins that one.</li>
   </ol>
   <p style="margin-top:14px;font-size:.84rem;color:var(--txt-3)">You’re 18 or over, and how you use this is on you.</p>`;
}
function gateOnly(){
  return `${safetyBody()}
   <button class="btn" style="margin-top:26px" onclick="hideGate()">Close</button>`;
}
function onbStepHTML(){
  if(onbStep===0)return `${stepBar()}${safetyBody()}
    <button class="btn" style="margin-top:26px" onclick="onbNext()">I understand, continue</button>`;
  if(onbStep===1)return `${stepBar()}
    <h1>What <em>colour</em> is your car?</h1>
    <p>It’s the only thing anyone will see. No name, no account.</p>
    <div style="margin-top:22px">${swatchGrid('onbColor')}</div>
    <button class="btn" style="margin-top:26px" onclick="onbNext()" ${S.car.color<0?'disabled':''}>Continue</button>
    <button class="skip" onclick="onbBack()">Back</button>`;
  return `${stepBar()}
    <h1>And what <em>shape?</em></h1>
    <p>Pick what people can actually see from the next lane.</p>
    <div style="margin-top:22px">${bodyChips('onbBody')}</div>
    <div class="card" style="margin-top:24px;display:flex;align-items:center;gap:13px">
      ${swatch(S.car.color<0?0:S.car.color)}<b style="font-size:1.05rem;letter-spacing:-.03em">${esc((S.car.color<0?'':COLORS[S.car.color][0]+' ')+BODIES[S.car.body])}</b></div>
    <p style="margin-top:16px">Your phone will ask for location next. Lane uses it to find the cars around you and never sends your exact spot.</p>
    <p style="margin-top:10px;font-size:.84rem;color:var(--txt-3)">Lane is only as busy as the road you’re on. If it’s quiet at first that’s normal, you might be the first car here.</p>
    <button class="btn" style="margin-top:16px" onclick="onbDone()">Start driving →</button>
    <button class="skip" onclick="onbBack()">Back</button>`;
}
window.onbNext=()=>{if(onbStep===1&&S.car.color<0)return;onbStep=Math.min(2,onbStep+1);showGate();};
window.onbBack=()=>{onbStep=Math.max(0,onbStep-1);showGate();};
window.onbColor=i=>{S.car.color=i;save();showGate();};
window.onbBody=i=>{S.car.body=i;save();showGate();};
window.onbDone=()=>{S.gate=GATE_V;save();hideGate();render(true);startGeo();acquireWake();sayHey();};
window.hideGate=()=>{document.getElementById('gate').classList.remove('show');};

/* ============ BOOT ============ */
render(true);
/* Defer the location prompt until onboarding is done, otherwise the native
   permission dialog pops over the safety gate with no context. Returning users
   (gate already accepted) get it immediately. */
if(S.gate!==GATE_V)showGate();
else startGeo();
netStart();
if(joinedLane)setTimeout(()=>toast(joinedLane===MEET.code?'You’re in '+MEET.name:'Joined lane “'+joinedLane+'”'),400);
</script>
