<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0B0C10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lane">
<meta name="description" content="Talk to the cars around you. Anonymous, nothing saved.">
<title>Lane &middot; talk to the cars around you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0C10;
  --card:#14161D;
  --card2:#1B1E27;
  --line:#252934;
  --text:#EDEFF4;
  --dim:#8E93A3;
  --amber:#FFB020;
  --amber-dim:#C4841200;
  --go:#3DDC7F;
  --stop:#FF5C5C;
  --cyan:#4DD8E6;
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:17px}
html,body{overflow-x:hidden}
body{
  font-family:'Space Grotesk',system-ui,sans-serif;
  background:var(--bg);color:var(--text);line-height:1.45;min-height:100vh;min-height:100dvh;
  padding-bottom:calc(88px + env(safe-area-inset-bottom));
}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:radial-gradient(420px 280px at 85% -60px,rgba(255,176,32,.10),transparent 70%),
             radial-gradient(360px 260px at -10% 18%,rgba(77,216,230,.06),transparent 70%);}
.xl{font-family:'Unbounded',sans-serif}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:1rem;color:var(--text)}
#view{max-width:520px;margin:0 auto;padding:0 16px}

/* top bar */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(16px + env(safe-area-inset-top)) 2px 12px}
.brand{font-family:'Unbounded';font-weight:900;font-size:1.15rem;letter-spacing:-.01em;
  background:linear-gradient(100deg,#FFE7B0 10%,var(--amber) 55%,#E08A00);-webkit-background-clip:text;background-clip:text;color:transparent}
.conn{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-weight:700;font-size:.74rem;letter-spacing:.04em;color:var(--dim)}
.conn .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
.conn.live{color:var(--go);border-color:#1E4430}
.conn.live .dot{background:var(--go);box-shadow:0 0 8px rgba(61,220,127,.8)}
.conn.wait{color:var(--amber);border-color:#4A3512}
.conn.wait .dot{background:var(--amber);animation:pulse 1.1s infinite}
.conn.off{color:var(--stop);border-color:#4A1F1F}
.conn.off .dot{background:var(--stop)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* headline block */
.hero{padding:2px 2px 14px}
.hero .big{font-family:'Unbounded';font-weight:900;font-size:2.5rem;line-height:1.05;letter-spacing:-.02em}
.hero .sb{font-size:.9rem;color:var(--dim);margin-top:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.lbl{font-size:.68rem;font-weight:800;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}

/* nearby rail */
.rail{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{display:none}
.carchip{flex-shrink:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:8px 14px 8px 9px;scroll-snap-align:start}
.carchip.me{border-color:#4A3512;background:linear-gradient(135deg,#2A2011,#191720)}
.carchip.muted{opacity:.4}
.sw{width:22px;height:22px;border-radius:7px;flex-shrink:0;border:1px solid rgba(255,255,255,.18)}
.carchip b{display:block;font-size:.8rem;font-weight:700;white-space:nowrap;line-height:1.2}
.carchip small{display:block;font-size:.68rem;color:var(--dim);font-weight:600;white-space:nowrap;line-height:1.2}

/* stream */
#stream{display:flex;flex-direction:column;gap:9px;min-height:180px;padding:2px 0 8px}
.msg{display:flex;gap:10px;align-items:flex-start;animation:rise .22s ease}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg .sw{width:26px;height:26px;border-radius:9px;margin-top:2px}
.msg .bub{background:var(--card);border:1px solid var(--line);border-radius:16px;border-top-left-radius:5px;padding:9px 13px;max-width:78%}
.msg .who{font-size:.66rem;font-weight:800;letter-spacing:.06em;color:var(--dim);text-transform:uppercase;margin-bottom:2px}
.msg .txt{font-size:.95rem;word-wrap:break-word;overflow-wrap:anywhere}
.msg.mine{flex-direction:row-reverse}
.msg.mine .bub{background:linear-gradient(135deg,#3A2C10,#241E14);border-color:#4A3512;border-top-left-radius:16px;border-top-right-radius:5px}
.msg.mine .who{text-align:right}
.msg.sys{justify-content:center}
.msg.sys .bub{background:none;border:none;color:var(--dim);font-size:.78rem;text-align:center;max-width:100%;padding:2px}
.empty{color:var(--dim);font-size:.86rem;text-align:center;padding:26px 14px;line-height:1.55}

/* bottom chrome: composer stacked on top of the nav, one fixed container */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(13,14,19,.94);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#dock:not(:empty){padding:10px 16px 4px;border-bottom:1px solid var(--line)}
.dock-in{max-width:520px;margin:0 auto}
.tiles{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.tiles::-webkit-scrollbar{display:none}
.tile{flex-shrink:0;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 15px;font-size:.84rem;font-weight:600;white-space:nowrap;min-height:44px}
.tile:active{transform:scale(.94)}
.tile.calm{border-color:#1E4430;color:var(--go)}
.tile.warn{border-color:#4A3512;color:var(--amber)}
.row{display:flex;gap:9px;align-items:flex-end}
.row textarea{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 15px;
  font-size:1rem;resize:none;max-height:96px;min-height:52px;line-height:1.35;outline:none}
.row textarea::placeholder{color:#5F6474}
.row textarea:focus{border-color:#4A3512}
.send{width:50px;height:50px;border-radius:16px;background:var(--amber);color:#1A1206;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 0 18px rgba(255,176,32,.28)}
.send svg{width:22px;height:22px;fill:currentColor}
.send:disabled{opacity:.35;box-shadow:none}
.send:active:not(:disabled){transform:scale(.92)}
.cap{font-size:.68rem;color:var(--dim);text-align:right;padding:5px 4px 0;font-weight:600}

/* locked state — the most-seen screen. no animation, no icon to interpret */
.locked{text-align:center;padding:16px 10px 10px}
.locked b{display:block;font-family:'Unbounded';font-size:1.5rem;font-weight:800;letter-spacing:-.01em}
.locked span{display:block;font-size:.92rem;color:var(--dim);margin-top:5px}
.drive{font-family:'Unbounded';font-size:1.6rem;font-weight:800;line-height:1.25;text-align:center;padding:30px 8px}
.drive small{display:block;font-family:'Space Grotesk';font-size:.8rem;font-weight:700;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;margin-bottom:10px}

/* buttons */
.btn{display:block;width:100%;background:var(--amber);color:#1A1206;font-weight:800;font-size:.95rem;border-radius:16px;padding:15px;text-align:center;box-shadow:0 0 18px rgba(255,176,32,.22)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:none;color:var(--stop);border:1px solid #4A1F1F;box-shadow:none}
.btn.sm{padding:11px;font-size:.86rem;border-radius:13px}

/* pickers */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:9px;margin-top:12px}
.swatches button{aspect-ratio:1;border-radius:15px;border:2px solid transparent;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px;
  font-size:.56rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:rgba(255,255,255,.82);text-shadow:0 1px 3px rgba(0,0,0,.9)}
.swatches button.on{border-color:var(--amber);box-shadow:0 0 14px rgba(255,176,32,.4)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:10px 16px;font-size:.84rem;font-weight:700;min-height:44px}
.chip.on{background:var(--amber);color:#1A1206;border-color:var(--amber)}

/* settings rows */
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border:none}
.srow .k{font-size:.9rem;font-weight:600}
.srow .k small{display:block;font-size:.74rem;color:var(--dim);font-weight:500;margin-top:2px;line-height:1.4}
input[type=text]{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;margin-top:11px;font-size:.88rem;outline:none;color-scheme:dark}
input[type=text]:focus{border-color:#4A3512}
input[type=text]::placeholder{color:#5F6474}
.sw-t{width:52px;height:31px;border-radius:999px;background:var(--card2);border:1px solid var(--line);position:relative;flex-shrink:0;transition:background .18s}
.sw-t i{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:var(--dim);transition:all .18s}
.sw-t.on{background:var(--amber);border-color:var(--amber)}
.sw-t.on i{left:25px;background:#1A1206}

.note{font-size:.8rem;color:var(--dim);line-height:1.55;margin-top:10px}
.warnbox{background:linear-gradient(135deg,#2A1810,#1B1620);border:1px solid #4A2A18;border-radius:16px;padding:14px;margin-bottom:12px}
.warnbox b{font-size:.88rem;color:var(--amber)}
.warnbox p{font-size:.82rem;color:var(--dim);margin-top:5px;line-height:1.5}

/* gate */
#gate{position:fixed;inset:0;z-index:200;background:var(--bg);overflow-y:auto;display:none;
  padding:calc(28px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
#gate.show{display:block}
#gate .in{max-width:460px;margin:0 auto}
#gate h1{font-family:'Unbounded';font-size:1.7rem;font-weight:900;line-height:1.15;letter-spacing:-.02em}
#gate h2{font-family:'Unbounded';font-size:1.05rem;font-weight:800;margin:18px 0 8px;color:var(--amber)}
#gate p{font-size:.9rem;color:var(--dim);line-height:1.6;margin-bottom:10px}
#gate ol{margin:10px 0 0;padding-left:20px}
#gate li{font-size:.9rem;color:var(--text);line-height:1.55;margin-bottom:9px}
#gate li b{color:var(--amber)}

/* nav */
nav{display:flex;justify-content:space-around;padding:10px 8px calc(10px + env(safe-area-inset-bottom))}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.66rem;font-weight:700;color:#5B6070;padding:4px 18px;letter-spacing:.04em}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--amber)}
nav button.on svg{filter:drop-shadow(0 0 7px rgba(255,176,32,.6))}
nav .bdg{position:absolute;top:-2px;right:6px;background:var(--amber);color:#1A1206;font-size:.6rem;font-weight:800;border-radius:999px;padding:1px 5px;line-height:1.5}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;background:var(--card);border-radius:26px 26px 0 0;border-top:1px solid var(--line);
  max-height:80vh;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;transform:translateY(102%);transition:transform .26s cubic-bezier(.3,.9,.3,1);
  padding:10px 18px calc(22px + env(safe-area-inset-bottom))}
#sheet.show{transform:none}
#sheet .grab{width:42px;height:4px;background:var(--line);border-radius:3px;margin:6px auto 14px}
.sheet-x{position:sticky;top:0;float:right;background:var(--amber);color:#1A1206;font-weight:800;font-size:.8rem;border-radius:999px;padding:8px 16px;margin:-6px 0 8px;z-index:5}
#sheet h3{font-family:'Unbounded';font-size:1.05rem;font-weight:800;margin-bottom:4px}

.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(14px);
  background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:11px 18px;font-size:.85rem;font-weight:600;
  z-index:120;opacity:0;pointer-events:none;transition:all .22s;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%)}
.fade{animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="view"></div>
<div id="scrim" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="bottom"><div id="dock"></div><nav id="nav"></nav></div>
<div id="toast" class="toast"></div>
<div id="gate"></div>
<script>
/* ============ DATA ============ */
const KEY='lane-v1';
const COLORS=[
 ['White','#F2F4F7'],['Silver','#C2C7D0'],['Grey','#7C828E'],['Black','#23262E'],
 ['Red','#E03A3A'],['Blue','#2F6FE0'],['Navy','#1E3364'],['Sky','#4DB6E6'],
 ['Green','#2E9E5B'],['Olive','#6B7A3A'],['Yellow','#EBC33A'],['Orange','#E8802A'],
 ['Brown','#6E4B32'],['Beige','#C9B896'],['Purple','#7E4FC4'],['Pink','#D96BA6']];
const BODIES=['Car','SUV','Truck','Van','Bike','Bus'];
/* Curated on purpose. De-escalation first and styled loudest — apology cools a
   situation down, venting winds it up, and tile order is a thumb on that scale. */
const TILES=[
 ['Go ahead — I’ll wait','calm'],['My bad ✋','calm'],['Thanks 👋','calm'],
 ['What’s the holdup?',''],['Accident ahead','warn'],['Road closed — turn around','warn'],
 ['Stalled car ahead','warn'],['Lights are out','warn'],['Cops ahead',''],
 ['Been stuck 20 min',''],['Moving again ✅','calm'],['Anyone know a way round?','']];
/* Shown while moving: hazard reports only, one tap, no reading required. */
const DRIVE_TILES=[4,5,6,7,10];

const blank=()=>({car:{color:-1,body:0},radius:500,lane:'',broker:0,customBroker:'',gate:0,sound:true});
let S=load();
function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY));
    if(d&&d.car)return Object.assign(blank(),d);
  }catch(e){}
  return blank();
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rid=n=>{let s='',a='abcdefghijkmnpqrstuvwxyz23456789';for(let i=0;i<n;i++)s+=a[Math.random()*a.length|0];return s;};
/* Rotates every session. The car is your face; this is not a name anyone can
   build a grudge against across drives. */
const MYID=rid(8);

/* ============ GEO ============ */
/* Geohash cell = the chat room. Precision is FIXED at 5 on purpose: if it varied
   with the user's radius setting, two cars parked side by side would compute
   different topics and never see each other. Verified: a 3x3 block of p5 cells
   covers a 2km radius with zero misses. */
const GH_PREC=5;
const B32='0123456789bcdefghjkmnpqrstuvwxyz';
function ghEncode(lat,lng,prec){
  let idx=0,bit=0,even=true,hash='';
  let latMin=-90,latMax=90,lngMin=-180,lngMax=180;
  while(hash.length<prec){
    if(even){const mid=(lngMin+lngMax)/2;if(lng>=mid){idx=idx*2+1;lngMin=mid;}else{idx=idx*2;lngMax=mid;}}
    else{const mid=(latMin+latMax)/2;if(lat>=mid){idx=idx*2+1;latMin=mid;}else{idx=idx*2;latMax=mid;}}
    even=!even;
    if(++bit===5){hash+=B32[idx];bit=0;idx=0;}
  }
  return hash;
}
const GH_NB={
 n:{even:'p0r21436x8zb9dcf5h7kjnmqesgutwvy',odd:'bc01fg45238967deuvhjyznpkmstqrwx'},
 s:{even:'14365h7k9dcfesgujnmqp0r2twvyx8zb',odd:'238967debc01fg45kmstqrwxuvhjyznp'},
 e:{even:'bc01fg45238967deuvhjyznpkmstqrwx',odd:'p0r21436x8zb9dcf5h7kjnmqesgutwvy'},
 w:{even:'238967debc01fg45kmstqrwxuvhjyznp',odd:'14365h7k9dcfesgujnmqp0r2twvyx8zb'}};
const GH_BD={
 n:{even:'prxz',odd:'bcfguvyz'},s:{even:'028b',odd:'0145hjnp'},
 e:{even:'bcfguvyz',odd:'prxz'},w:{even:'0145hjnp',odd:'028b'}};
function ghAdj(hash,dir){
  const last=hash.charAt(hash.length-1),type=(hash.length%2)?'odd':'even';
  let base=hash.substring(0,hash.length-1);
  if(GH_BD[dir][type].indexOf(last)!==-1&&base.length)base=ghAdj(base,dir);
  return base+B32[GH_NB[dir][type].indexOf(last)];
}
function ghNeighbors(h){
  const n=ghAdj(h,'n'),s=ghAdj(h,'s');
  return [h,n,s,ghAdj(h,'e'),ghAdj(h,'w'),ghAdj(n,'e'),ghAdj(n,'w'),ghAdj(s,'e'),ghAdj(s,'w')];
}
function dist(a1,o1,a2,o2){
  const R=6371000,t=Math.PI/180;
  const dLat=(a2-a1)*t,dLon=(o2-o1)*t;
  const x=Math.sin(dLat/2)**2+Math.cos(a1*t)*Math.cos(a2*t)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
/* Published position is snapped to a ~55m grid. The broker is public — anyone can
   subscribe. Coarse enough that a harvester gets a block, not a driveway; fine
   enough that the radius filter still works. */
const QUANT=0.0005;
const snap=v=>Math.round(v/QUANT)*QUANT;

/* ---- motion state machine ---- */
/* Fails closed: unknown speed, stale fix or bad accuracy all count as MOVING. */
let pos=null,gpsErr=null,moving=true,parked=false,parkedAt=0;
let spdBuf=[],lastFix=null,stillSince=0;
const MOVE_MS=3,STOP_MS=0.5,STOP_HOLD=3000,STALE_MS=8000;

function onFix(p){
  gpsErr=null;
  const c=p.coords,t=p.timestamp||Date.now();
  let sp=(typeof c.speed==='number'&&!isNaN(c.speed)&&c.speed>=0)?c.speed:null;
  if(sp==null&&lastFix){ /* device gave no speed: derive it from the fix delta */
    const dt=(t-lastFix.t)/1000;
    if(dt>0.4&&dt<30)sp=dist(lastFix.la,lastFix.lo,c.latitude,c.longitude)/dt;
  }
  lastFix={la:c.latitude,lo:c.longitude,t};
  pos={la:c.latitude,lo:c.longitude,acc:c.accuracy,t};
  if(sp!=null){spdBuf.push(sp);if(spdBuf.length>5)spdBuf.shift();}
  evalMotion();
  netTick();
}
function medSpeed(){
  if(!spdBuf.length)return null;
  const a=[...spdBuf].sort((x,y)=>x-y);
  return a[a.length>>1];
}
function evalMotion(){
  const was=moving;
  const sp=medSpeed(),now=Date.now();
  const stale=!pos||now-pos.t>STALE_MS;
  const bad=pos&&pos.acc>60;
  if(parked){ /* re-armed every session, never persisted, cancels itself */
    if(sp!=null&&sp>=MOVE_MS){parked=false;toast('Moving — parked mode off');}
    else moving=false;
  }
  else if(stale||bad||sp==null){moving=true;stillSince=0;}
  else if(sp>=MOVE_MS){moving=true;stillSince=0;}
  else if(sp<STOP_MS){
    if(!stillSince)stillSince=now;
    if(now-stillSince>=STOP_HOLD)moving=false;
  }
  else stillSince=0;
  if(was!==moving){
    if(moving&&draft.trim()){heldDraft=draft;draft='';}
    renderDock();
    if(tab==='road')render();
  }
}
setInterval(evalMotion,1200);

function startGeo(){
  if(!navigator.geolocation){gpsErr='no-api';renderDock();return;}
  navigator.geolocation.watchPosition(onFix,e=>{
    gpsErr=e.code===1?'denied':e.code===2?'unavailable':'timeout';
    moving=!parked;renderDock();if(tab==='road')render();
  },{enableHighAccuracy:true,maximumAge:4000,timeout:20000});
}

/* ============ MQTT 3.1.1 over WebSocket ============ */
/* Hand-rolled so the page stays a single file with no CDN. QoS 0 only — chat
   that arrives late is worthless anyway. */
const BROKERS=[
 ['EMQX','wss://broker.emqx.io:8084/mqtt'],
 ['HiveMQ','wss://broker.hivemq.com:8884/mqtt'],
 ['Mosquitto','wss://test.mosquitto.org:8081/mqtt']];
const te=new TextEncoder(),td=new TextDecoder();
function vbe(n){const o=[];do{let b=n%128;n=Math.floor(n/128);if(n>0)b|=128;o.push(b);}while(n>0);return o;}
function vbeRead(b,i){
  let mult=1,val=0,used=0,c;
  do{
    if(i+used>=b.length)return null;
    if(used>=4)throw new Error('bad length');
    c=b[i+used];used++;val+=(c&127)*mult;mult*=128;
  }while((c&128)!==0);
  return{value:val,bytes:used};
}
function sBytes(s){const u=te.encode(s);return[u.length>>8,u.length&255,...u];}
function pkt(type,flags,body){return new Uint8Array([(type<<4)|flags,...vbe(body.length),...body]);}

function MqttClient(url,opts){
  const self=this;
  let ws=null,buf=new Uint8Array(0),pingT=null,pid=1,alive=false;
  this.onconnect=opts.onconnect;this.onmessage=opts.onmessage;this.onclose=opts.onclose;
  this.connect=function(){
    try{ws=new WebSocket(url,'mqtt');}catch(e){self.onclose('bad-url');return;}
    ws.binaryType='arraybuffer';
    ws.onopen=()=>{
      /* keepalive 60s; broker drops us at 1.5x if we go quiet */
      send(pkt(1,0,[...sBytes('MQTT'),0x04,0x02,0,60,...sBytes('lane-'+MYID)]));
    };
    ws.onmessage=e=>feed(new Uint8Array(e.data));
    ws.onerror=()=>{};
    ws.onclose=()=>{stop();self.onclose('closed');};
  };
  function send(u8){if(ws&&ws.readyState===1)ws.send(u8);}
  function stop(){alive=false;if(pingT)clearInterval(pingT);pingT=null;}
  this.close=function(){stop();if(ws){ws.onclose=null;try{ws.close();}catch(e){}}ws=null;};
  this.publish=function(topic,payload){
    if(!alive)return false;
    send(pkt(3,0,[...sBytes(topic),...te.encode(payload)]));
    return true;
  };
  this.subscribe=function(topics){
    if(!alive||!topics.length)return;
    const body=[pid>>8,pid&255];pid=(pid%65535)+1;
    topics.forEach(t=>body.push(...sBytes(t),0));
    send(pkt(8,2,body)); /* low nibble MUST be 0b0010 or the broker just hangs up */
  };
  this.unsubscribe=function(topics){
    if(!alive||!topics.length)return;
    const body=[pid>>8,pid&255];pid=(pid%65535)+1;
    topics.forEach(t=>body.push(...sBytes(t)));
    send(pkt(10,2,body));
  };
  /* A WS frame may carry several MQTT packets, or half of one. Buffer and rescan. */
  function feed(chunk){
    const m=new Uint8Array(buf.length+chunk.length);
    m.set(buf,0);m.set(chunk,buf.length);buf=m;
    for(;;){
      if(buf.length<2)return;
      let rl;
      try{rl=vbeRead(buf,1);}catch(e){self.close();self.onclose('malformed');return;}
      if(!rl)return;
      const total=1+rl.bytes+rl.value;
      if(buf.length<total)return;
      handle(buf[0]>>4,buf[0]&15,buf.subarray(1+rl.bytes,total));
      buf=buf.subarray(total);
    }
  }
  function handle(type,flags,body){
    if(type===2){
      if(body[1]!==0){self.close();self.onclose('refused-'+body[1]);return;}
      alive=true;
      pingT=setInterval(()=>send(new Uint8Array([0xC0,0x00])),25000);
      self.onconnect();
    }else if(type===3){
      const tl=(body[0]<<8)|body[1];
      const topic=td.decode(body.subarray(2,2+tl));
      const qos=(flags>>1)&3;
      const off=2+tl+(qos>0?2:0);
      self.onmessage(topic,td.decode(body.subarray(off)));
    }
  }
}

/* ============ NET ============ */
let mq=null,brokerIdx=0,connState='off',subbed=[],retry=0,retryT=null;
const peers=new Map();
let msgs=[],seen=new Set(),unread=0;
const MUTED=new Set();
const HEARTBEAT=15000,PEER_TTL=50000,MSG_TTL=420000;
const brokerUrl=()=>S.customBroker.trim()||BROKERS[clamp(S.broker,0,BROKERS.length-1)][1];
const brokerName=()=>S.customBroker.trim()?'Custom':BROKERS[clamp(S.broker,0,BROKERS.length-1)][0];
const myCell=()=>S.lane.trim()?null:(pos?ghEncode(pos.la,pos.lo,GH_PREC):null);
const topicsFor=()=>{
  if(S.lane.trim())return['lane/v1/priv/'+encodeURIComponent(S.lane.trim().toLowerCase())];
  const c=myCell();
  return c?ghNeighbors(c).map(x=>'lane/v1/'+x):[];
};
const myTopic=()=>{
  if(S.lane.trim())return 'lane/v1/priv/'+encodeURIComponent(S.lane.trim().toLowerCase());
  const c=myCell();
  return c?'lane/v1/'+c:null;
};

function setConn(s){if(connState!==s){connState=s;paintConn();}}
function netStart(){
  if(mq){mq.close();mq=null;}
  if(retryT){clearTimeout(retryT);retryT=null;}
  setConn('wait');
  const url=brokerUrl();
  mq=new MqttClient(url,{
    onconnect(){
      retry=0;setConn('live');subbed=[];
      syncSubs();sayHey();
      if(tab==='road')render();
    },
    onmessage(topic,raw){onWire(raw);},
    onclose(why){
      setConn('off');subbed=[];
      /* Backoff with jitter. A tight reconnect loop gets the whole app
         rate-limited on a shared public broker. */
      if(!S.customBroker.trim()&&(why==='closed'||why==='bad-url')&&retry>=2){
        S.broker=(clamp(S.broker,0,BROKERS.length-1)+1)%BROKERS.length;save();retry=0;
      }
      retry++;
      const wait=Math.min(15000,1000*Math.pow(2,Math.min(retry,4)))+Math.random()*1200;
      retryT=setTimeout(netStart,wait);
    }
  });
  mq.connect();
}
function syncSubs(){
  if(connState!=='live')return;
  const want=topicsFor();
  if(!want.length)return;
  const add=want.filter(t=>subbed.indexOf(t)<0);
  const drop=subbed.filter(t=>want.indexOf(t)<0);
  if(drop.length)mq.unsubscribe(drop);
  if(add.length)mq.subscribe(add);
  subbed=want;
}
function pub(obj){
  const t=myTopic();
  if(!t||connState!=='live')return false;
  return mq.publish(t,JSON.stringify(obj));
}
/* In a private lane the room is the code, not the place — so don't put any
   position on the wire at all. Nothing to leak, nothing to filter on. */
const wireLat=()=>(S.lane.trim()||!pos)?0:snap(pos.la);
const wireLng=()=>(S.lane.trim()||!pos)?0:snap(pos.lo);
function sayHey(){
  if(S.car.color<0)return;
  if(!S.lane.trim()&&!pos)return;
  pub({v:1,k:'hey',id:MYID,c:S.car.color,b:S.car.body,la:wireLat(),lo:wireLng(),ts:Date.now()});
}
function sayBye(){pub({v:1,k:'bye',id:MYID,ts:Date.now()});}

function onWire(raw){
  let m;
  try{m=JSON.parse(raw);}catch(e){return;}
  if(!m||m.v!==1||typeof m.id!=='string'||m.id===MYID)return;
  if(m.k==='bye'){if(peers.delete(m.id))paintPeers();return;}
  const c=clamp(m.c|0,0,COLORS.length-1),b=clamp(m.b|0,0,BODIES.length-1);
  const la=+m.la,lo=+m.lo;
  let d=null;
  if(pos&&isFinite(la)&&isFinite(lo)&&(la||lo)){
    d=dist(pos.la,pos.lo,la,lo);
    if(!S.lane.trim()&&d>S.radius)return; /* out of your ring: not your traffic */
  }
  const p=peers.get(m.id)||{id:m.id};
  p.c=c;p.b=b;p.d=d;p.last=Date.now();
  peers.set(m.id,p);
  paintPeers();
  if(m.k==='msg'){
    if(MUTED.has(m.id))return;
    const txt=String(m.t==null?'':m.t).slice(0,240);
    if(!txt.trim())return;
    const key=m.id+'|'+(m.ts|0)+'|'+txt;
    if(seen.has(key))return; /* brokers can redeliver; never show a line twice */
    seen.add(key);if(seen.size>400)seen=new Set([...seen].slice(-200));
    addMsg({id:m.id,c,b,txt,ts:Date.now(),mine:false});
  }
}
function addMsg(m){
  msgs.push(m);
  if(msgs.length>120)msgs=msgs.slice(-80);
  if(tab==='road')paintStream();
  else{unread++;nav();}
  if(!m.mine&&!moving&&S.sound)blip();
}
/* GC: drop peers that stopped heartbeating and messages past their TTL. */
setInterval(()=>{
  const now=Date.now();let ch=false;
  peers.forEach((p,k)=>{if(now-p.last>PEER_TTL){peers.delete(k);ch=true;}});
  const before=msgs.length;
  msgs=msgs.filter(m=>now-m.ts<MSG_TTL);
  if(ch)paintPeers();
  if(msgs.length!==before&&tab==='road')paintStream();
},5000);

let lastHey=0,lastCell=null;
function netTick(){
  const now=Date.now();
  const cell=myCell();
  if(cell!==lastCell){
    lastCell=cell;
    syncSubs();
    peers.clear();paintPeers();
  }
  if(now-lastHey>HEARTBEAT){lastHey=now;sayHey();}
}
setInterval(netTick,5000);
window.addEventListener('pagehide',()=>{sayBye();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){moving=true;renderDock();} /* backgrounded: assume driving */
  else{evalMotion();sayHey();}
});

const view=document.getElementById('view');
let tab='road',draft='',heldDraft='';
const ICONS={
 road:'<svg viewBox="0 0 24 24"><path d="M4 21L7.5 3M20 21L16.5 3M12 4v3M12 10.5v3M12 17v3"/></svg>',
 cars:'<svg viewBox="0 0 24 24"><path d="M5 17h14M3.5 13.5l1.6-5A2 2 0 0 1 7 7h10a2 2 0 0 1 1.9 1.5l1.6 5"/><path d="M3.5 13.5h17v3.5h-17z"/><circle cx="7.5" cy="17" r="1.6"/><circle cx="16.5" cy="17" r="1.6"/></svg>',
 me:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c1.2-4 4-6 7.5-6s6.3 2 7.5 6"/></svg>'};
const SEND='<svg viewBox="0 0 24 24"><path d="M3.4 20.4l18.2-8.4L3.4 3.6l0 6.5 12 1.9-12 1.9z"/></svg>';

function nav(){
  document.getElementById('nav').innerHTML=[['road','ROAD'],['cars','CARS'],['me','ME']]
    .map(([id,l])=>`<button class="${tab===id?'on':''}" onclick="go('${id}')">${ICONS[id]}${l}${
      id==='road'&&unread&&tab!=='road'?`<span class="bdg">${unread>9?'9+':unread}</span>`:''}</button>`).join('');
}
window.go=t=>{tab=t;if(t==='road')unread=0;render(true);};
function render(toTop){
  const y=window.scrollY;nav();
  view.innerHTML=`<div class="fade">${({road:rRoad,cars:rCars,me:rMe})[tab]()}</div>`;
  renderDock();
  if(tab==='road')paintStream();

}
let _lockY=0;
function lockScroll(){_lockY=window.scrollY||0;const b=document.body;b.style.position='fixed';b.style.top=(-_lockY)+'px';b.style.left='0';b.style.right='0';b.style.width='100%';}
function unlockScroll(){const b=document.body;b.style.position='';b.style.top='';b.style.left='';b.style.right='';window.scrollTo(0,_lockY);}
function openSheet(html){
  const sh=document.getElementById('sheet');
  const was=sh.classList.contains('show');
  sh.innerHTML='<div class="grab"></div><button class="sheet-x" onclick="closeSheet()">Done</button>'+html;
  if(!was){lockScroll();sh.classList.add('show');document.getElementById('scrim').classList.add('show');}
  sh.scrollTop=0;
}
window.closeSheet=()=>{
  const sh=document.getElementById('sheet');
  if(sh.classList.contains('show'))unlockScroll();
  sh.classList.remove('show');document.getElementById('scrim').classList.remove('show');
};
(function(){
  const sh=document.getElementById('sheet');let sy=null;
  sh.addEventListener('touchstart',e=>{sy=sh.scrollTop<=0?e.touches[0].clientY:null;},{passive:true});
  sh.addEventListener('touchmove',e=>{if(sy!=null&&e.touches[0].clientY-sy>90){sy=null;closeSheet();}},{passive:true});
})();
let toastT=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  if(toastT)clearTimeout(toastT);
  toastT=setTimeout(()=>t.classList.remove('show'),2200);
}
let actx=null;
function blip(){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    o.frequency.value=660;g.gain.value=.05;
    o.start();g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.16);
    o.stop(actx.currentTime+.17);
  }catch(e){}
}

/* ============ SHARED BITS ============ */
const carName=p=>COLORS[p.c][0]+' '+BODIES[p.b];
const swatch=(ci,cls)=>`<span class="sw ${cls||''}" style="background:${COLORS[ci][1]}"></span>`;
/* Two red cars at the same light read as one person. Only when a colour+shape is
   actually doubled up do we add two letters off the session id — enough to follow
   who said what, still nothing that survives to the next drive. */
function dupCombos(){
  const by=new Map();
  const add=(id,c,b)=>{const k=c+'|'+b;if(!by.has(k))by.set(k,new Set());by.get(k).add(id);};
  if(S.car.color>=0)add(MYID,S.car.color,S.car.body);
  nearby().forEach(p=>add(p.id,p.c,p.b));
  msgs.forEach(m=>{if(!m.sys)add(m.id,m.c,m.b);});
  const dup=new Set();
  by.forEach((ids,k)=>{if(ids.size>1)dup.add(k);});
  return dup;
}
const label=(id,c,b,dup)=>COLORS[c][0]+' '+BODIES[b]+(dup&&dup.has(c+'|'+b)?' '+id.slice(0,2).toUpperCase():'');
/* Coarse buckets only. Never a bearing, never "behind you" — that turns an
   anonymous message into a targeting reticle for the car it names. */
function band(d){
  if(d==null)return '';
  if(d<80)return 'right here';
  if(d<250)return 'close';
  if(d<600)return 'nearby';
  if(d<1200)return 'up the road';
  return 'far off';
}
function nearby(){
  const now=Date.now();
  return [...peers.values()].filter(p=>now-p.last<PEER_TTL).sort((a,b)=>(a.d??9e9)-(b.d??9e9));
}
function statusChip(){
  const n=nearby().length;
  const cls=connState==='live'?(n?'live':'wait'):connState==='wait'?'wait':'off';
  const txt=connState==='live'?(n?n+' near you':'listening'):connState==='wait'?'connecting':'offline';
  return `<span class="conn ${cls}" onclick="netSheet()"><span class="dot"></span>${esc(txt)}</span>`;
}
function paintConn(){
  const el=document.querySelector('.topbar .conn');
  if(el)el.outerHTML=statusChip();
}
function paintPeers(){
  const r=document.getElementById('rail');
  if(r)r.innerHTML=railHTML();
  paintConn();
  if(tab==='cars')render();
}

/* ============ ROAD ============ */
function railHTML(){
  const list=nearby(),dup=dupCombos();
  const mine=S.car.color<0?'':`<div class="carchip me">${swatch(S.car.color)}<div><b>You</b><small>${esc(BODIES[S.car.body])}</small></div></div>`;
  if(!list.length)return mine;
  return mine+list.map(p=>`<div class="carchip ${MUTED.has(p.id)?'muted':''}">${swatch(p.c)}<div><b>${esc(label(p.id,p.c,p.b,dup))}</b><small>${esc(band(p.d)||'in range')}</small></div></div>`).join('');
}
function rRoad(){
  if(S.car.color<0)return rPick();
  return `<div class="topbar"><span class="brand">Lane</span>${statusChip()}</div>
  ${gpsErr?`<div class="warnbox"><b>${gpsErr==='denied'?'Location is off':'No GPS fix'}</b>
    <p>${gpsErr==='denied'
      ?'Lane finds the cars around you by location. Turn it on in your browser settings, or use a private lane code from ME to talk to a specific group.'
      :'Waiting for a fix. Under cover or indoors this can take a while.'}</p></div>`:''}
  <div class="rail" id="rail">${railHTML()}</div>
  <div id="stream"></div>`;
}
function paintStream(){
  const el=document.getElementById('stream');
  if(!el)return;
  /* Driving: one message, large, no scrollback. Reading is a glance too. */
  if(moving){
    const last=msgs[msgs.length-1];
    el.innerHTML=last
      ?`<div class="drive"><small>${esc(last.mine?'You said':label(last.id,last.c,last.b,dupCombos()))}</small>${esc(last.txt)}</div>`
      :`<div class="drive"><small>Quiet out here</small>Eyes up.</div>`;
    return;
  }
  if(!msgs.length){
    el.innerHTML=`<div class="empty">${connState==='live'
      ?(nearby().length?'No one’s said anything yet. Break the ice.':'No other cars in range yet. Lane only works where someone else has it open too.')
      :'Connecting to the road…'}</div>`;
    return;
  }
  const dup=dupCombos();
  el.innerHTML=msgs.map(m=>m.sys
    ?`<div class="msg sys"><div class="bub">${esc(m.txt)}</div></div>`
    :`<div class="msg ${m.mine?'mine':''}">${swatch(m.c)}
       <div class="bub"><div class="who">${esc(m.mine?'You':label(m.id,m.c,m.b,dup))}</div>
       <div class="txt">${esc(m.txt)}</div></div></div>`).join('');
  const s=document.getElementById('stream');
  if(s)s.scrollIntoView({block:'end'});
}

/* ---- composer ---- */
/* Client-side only, so trivially bypassable by anyone who opens devtools. It is
   friction for normal use, not a security control. */
let sendLog=[];
function cooldown(){
  const now=Date.now();
  sendLog=sendLog.filter(t=>now-t<300000);
  if(sendLog.length>=14)return 'You’ve said a lot. Give it 5.';
  const last=sendLog[sendLog.length-1];
  if(last&&now-last<2500)return 'Take a beat.';
  return null;
}
function renderDock(){
  const d=document.getElementById('dock');
  d.innerHTML=(tab!=='road'||S.car.color<0)?'':`<div class="dock-in">${moving?driveDock():stopDock()}</div>`;
  fitBottom();
}
/* The composer grows and shrinks (tiles, held draft, char counter), so the page
   padding has to follow it or the last message hides behind the dock. */
function fitBottom(){
  requestAnimationFrame(()=>{
    const b=document.getElementById('bottom');
    document.body.style.paddingBottom=((b&&b.offsetHeight||70)+18)+'px';
  });
}
addEventListener('resize',fitBottom);
function driveDock(){
  return `<div class="tiles">${DRIVE_TILES.map(i=>
    `<button class="tile ${TILES[i][1]}" onclick="quick(${i})">${esc(TILES[i][0])}</button>`).join('')}</div>
  <div class="locked"><b>You’re moving.</b><span>Typing comes back when you stop.</span></div>`;
}
function stopDock(){
  const left=240-draft.length;
  return `<div class="tiles">${TILES.map((t,i)=>
    `<button class="tile ${t[1]}" onclick="quick(${i})">${esc(t[0])}</button>`).join('')}</div>
  ${heldDraft?`<button class="btn ghost sm" style="margin-bottom:9px" onclick="restore()">Finish your message?</button>`:''}
  <div class="row">
    <textarea id="ta" rows="1" maxlength="240" placeholder="Say it to the cars nearby…"
      oninput="onType(this)" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendNow();}">${esc(draft)}</textarea>
    <!-- placeholder stays short on purpose: it has to fit one line next to the send button -->

    <button class="send" onclick="sendNow()" ${draft.trim()?'':'disabled'}>${SEND}</button>
  </div>
  ${draft.length>180?`<div class="cap">${left} left</div>`:''}`;
}
window.onType=el=>{
  draft=el.value;
  el.style.height='auto';el.style.height=Math.min(96,el.scrollHeight)+'px';
  const b=document.querySelector('.send');
  if(b)b.disabled=!draft.trim();
};
window.restore=()=>{draft=heldDraft;heldDraft='';renderDock();const t=document.getElementById('ta');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}};
window.quick=i=>{push(TILES[i][0]);};
window.sendNow=()=>{
  const t=draft.trim();
  if(!t)return;
  if(push(t)){draft='';heldDraft='';renderDock();}
};
function push(txt){
  if(S.car.color<0){toast('Pick your car first');return false;}
  if(connState!=='live'){toast('Not connected yet');return false;}
  if(!S.lane.trim()&&!pos){toast('Waiting for location');return false;}
  const cd=cooldown();
  if(cd){toast(cd);return false;}
  const ts=Date.now();
  const ok=pub({v:1,k:'msg',id:MYID,c:S.car.color,b:S.car.body,
    la:wireLat(),lo:wireLng(),t:txt.slice(0,240),ts});
  if(!ok){toast('Message didn’t go out');return false;}
  sendLog.push(ts);
  addMsg({id:MYID,c:S.car.color,b:S.car.body,txt:txt.slice(0,240),ts,mine:true});
  return true;
}

/* ============ CARS ============ */
function rCars(){
  const list=nearby(),dup=dupCombos();
  return `<div class="topbar"><span class="brand">Cars</span>${statusChip()}</div>
  <div class="hero"><div class="big">${list.length}</div>
    <div class="sb">${list.length===1?'car in range':'cars in range'} · within ${S.radius>=1000?(S.radius/1000)+' km':S.radius+' m'}</div></div>
  ${S.car.color>=0?`<div class="card"><span class="lbl">You</span>
    <div style="display:flex;align-items:center;gap:11px;margin-top:11px">${swatch(S.car.color)}
      <div><b style="font-size:.95rem">${esc(COLORS[S.car.color][0]+' '+BODIES[S.car.body])}</b>
      <small style="display:block;font-size:.76rem;color:var(--dim)">${S.lane.trim()?'private lane · '+esc(S.lane.trim()):myCell()?'cell '+esc(myCell()):'no fix yet'}</small></div></div></div>`:''}
  ${list.length?list.map(p=>`<div class="card" style="padding:13px 15px">
    <div style="display:flex;align-items:center;gap:11px">${swatch(p.c)}
      <div style="flex:1;min-width:0"><b style="font-size:.92rem">${esc(label(p.id,p.c,p.b,dup))}</b>
        <small style="display:block;font-size:.75rem;color:var(--dim)">${esc(band(p.d)||'in range')}</small></div>
      <button class="chip" style="min-height:38px;padding:8px 14px;font-size:.78rem" onclick="toggleMute('${esc(p.id)}')">${MUTED.has(p.id)?'Unmute':'Mute'}</button>
    </div></div>`).join('')
   :`<div class="empty">Nobody else yet.<br><br>Lane needs another car with the app open and a signal. It won’t invent traffic that isn’t there.</div>`}
  <p class="note">Muting lasts for this session. Everyone’s ID changes every time they open the app, so a mute can’t follow someone across drives — that’s the cost of nobody being able to build a grudge against you either.</p>`;
}
window.toggleMute=id=>{
  if(MUTED.has(id))MUTED.delete(id);else MUTED.add(id);
  render();
};

/* ============ ME ============ */
function rMe(){
  return `<div class="topbar"><span class="brand">You</span>${statusChip()}</div>
  <div class="card">
    <span class="lbl">Your car</span>
    <div style="display:flex;align-items:center;gap:12px;margin-top:12px">
      ${S.car.color>=0?swatch(S.car.color):'<span class="sw" style="background:var(--card2)"></span>'}
      <b style="flex:1;font-size:1rem">${S.car.color>=0?esc(COLORS[S.car.color][0]+' '+BODIES[S.car.body]):'Not set'}</b>
      <button class="chip" onclick="carSheet()">Change</button></div>
  </div>
  <div class="card">
    <span class="lbl">Range</span>
    <div class="chips">${[250,500,1000,2000].map(r=>
      `<button class="chip ${S.radius===r?'on':''}" onclick="setRadius(${r})">${r>=1000?(r/1000)+' km':r+' m'}</button>`).join('')}</div>
    <p class="note">How far a car can be and still show up. A light is 250 m. A motorway jam is 2 km.</p>
  </div>
  <div class="card">
    <div class="srow"><div class="k">Parked
      <small>Unlocks typing when GPS can’t tell you’ve stopped. Switches itself off the moment you move, and never carries over to your next trip.</small></div>
      <button class="sw-t ${parked?'on':''}" onclick="togParked()"><i></i></button></div>
    <div class="srow"><div class="k">Sound<small>A blip when a message lands while you’re stopped.</small></div>
      <button class="sw-t ${S.sound?'on':''}" onclick="togSound()"><i></i></button></div>
  </div>
  <div class="card">
    <span class="lbl">Private lane</span>
    <input type="text" placeholder="a word you both know" value="${esc(S.lane)}" onchange="setLane(this.value)">
    <p class="note">Leave it empty for real traffic around you. Fill it in and you only see people who typed the same word — location is ignored. Handy for testing with a friend, or a convoy.</p>
  </div>
  <div class="card">
    <span class="lbl">Relay</span>
    <div class="chips">${BROKERS.map((b,i)=>
      `<button class="chip ${!S.customBroker.trim()&&S.broker===i?'on':''}" onclick="setBroker(${i})">${esc(b[0])}</button>`).join('')}</div>
    <input type="text" placeholder="or your own wss://host:port/mqtt" value="${esc(S.customBroker)}" onchange="setCustom(this.value)">
    <p class="note">Currently on <b>${esc(brokerName())}</b>. These are free public MQTT brokers — <b>anyone can listen to them</b>. Lane rounds your position to about 55 m before sending and never sends a name, but don’t type anything here you’d mind a stranger reading. Point it at your own broker if you want it private.</p>
  </div>
  <div class="card">
    <button class="btn ghost sm" onclick="showGate(true)">Read the safety notice again</button>
    <button class="btn danger sm" style="margin-top:9px" onclick="wipe()">Reset everything</button>
  </div>
  <p class="note" style="text-align:center;padding-bottom:10px">Nothing you say is stored anywhere — not on your phone, not on a server. Messages fade after a few minutes and are gone for good.</p>`;
}
window.setRadius=r=>{S.radius=r;save();peers.clear();render();};
window.togParked=()=>{
  parked=!parked;
  if(parked){parkedAt=Date.now();toast('Parked mode on');}
  evalMotion();renderDock();render();
};
window.togSound=()=>{S.sound=!S.sound;save();render();};
window.setLane=v=>{S.lane=v.trim().slice(0,24);save();peers.clear();msgs=[];lastCell=null;subbed=[];netStart();render();};
window.setBroker=i=>{S.broker=i;S.customBroker='';save();retry=0;netStart();render();};
window.setCustom=v=>{S.customBroker=v.trim().slice(0,200);save();retry=0;netStart();render();};
window.carSheet=()=>{
  openSheet(`<h3>Your car</h3>
   <p style="font-size:.84rem;color:var(--dim);margin-bottom:6px">The only thing anyone sees.</p>
   <span class="lbl">Colour</span>
   <div class="swatches">${COLORS.map((c,i)=>
     `<button class="${S.car.color===i?'on':''}" style="background:${c[1]}" onclick="setColor2(${i})">${esc(c[0])}</button>`).join('')}</div>
   <div style="height:14px"></div>
   <span class="lbl">Shape</span>
   <div class="chips">${BODIES.map((b,i)=>
     `<button class="chip ${S.car.body===i?'on':''}" onclick="setBody2(${i})">${esc(b)}</button>`).join('')}</div>`);
};
window.setColor2=i=>{S.car.color=i;save();carSheet();render();sayHey();};
window.setBody2=i=>{S.car.body=i;save();carSheet();render();sayHey();};
window.netSheet=()=>{
  const c=myCell();
  openSheet(`<h3>Connection</h3>
   <div class="srow"><div class="k">Relay</div><b style="font-size:.85rem;color:var(--amber)">${esc(brokerName())}</b></div>
   <div class="srow"><div class="k">Status</div><b style="font-size:.85rem">${connState==='live'?'Connected':connState==='wait'?'Connecting…':'Offline'}</b></div>
   <div class="srow"><div class="k">Location</div><b style="font-size:.85rem">${gpsErr?esc(gpsErr):pos?'±'+Math.round(pos.acc)+' m':'waiting'}</b></div>
   <div class="srow"><div class="k">${S.lane.trim()?'Private lane':'Area'}</div><b style="font-size:.85rem">${S.lane.trim()?esc(S.lane.trim()):c?esc(c):'—'}</b></div>
   <div class="srow"><div class="k">Cars in range</div><b style="font-size:.85rem">${nearby().length}</b></div>
   <p class="note">Lane groups people by a map square about 4 km across, then only shows you the ones inside your range setting.</p>
   <button class="btn ghost sm" style="margin-top:12px" onclick="closeSheet();retry=0;netStart();toast('Reconnecting…')">Reconnect</button>`);
};
window.wipe=()=>{
  openSheet(`<h3>Reset everything?</h3>
   <p style="font-size:.87rem;color:var(--dim);margin:8px 0 16px">Clears your car, your settings and the safety notice. Messages were never saved in the first place.</p>
   <button class="btn danger" onclick="doWipe()">Reset</button>
   <button class="btn ghost" style="margin-top:9px" onclick="closeSheet()">Keep it</button>`);
};
window.doWipe=()=>{
  try{localStorage.removeItem(KEY);}catch(e){}
  S=blank();msgs=[];peers.clear();MUTED.clear();closeSheet();showGate();render(true);
};

/* ============ SAFETY GATE ============ */
const GATE_V=1;
function showGate(again){
  const g=document.getElementById('gate');
  g.innerHTML=`<div class="in">
   <h1>Before you drive</h1>
   <h2>This is for when you’re stopped. Not when you’re moving.</h2>
   <p>Using a phone while driving is illegal in most places — including while you’re sat at a red light in the UK, France, Germany and most US states. This app doesn’t change that. Check your own local law.</p>
   <p>Reading or typing while driving roughly doubles your crash risk, and your attention doesn’t fully come back for up to 27 seconds afterwards.</p>
   <ol>
    <li><b>Lane locks itself when you’re moving.</b> It can be wrong. You’re still the one driving.</li>
    <li><b>Everyone here can see your car.</b> Assume they know which message was yours.</li>
    <li><b>If someone gets under your skin, put the phone down.</b> Nobody wins that one.</li>
   </ol>
   <button class="btn" style="margin-top:22px" onclick="acceptGate()">I understand — continue</button>
   ${again?`<button class="btn ghost" style="margin-top:9px" onclick="hideGate()">Close</button>`:''}
   <p style="font-size:.76rem;color:var(--dim);margin-top:16px;text-align:center;line-height:1.5">Anonymous. Nothing saved. Messages fade in minutes.</p>
  </div>`;
  g.classList.add('show');
}
window.acceptGate=()=>{S.gate=GATE_V;save();hideGate();};
window.hideGate=()=>{document.getElementById('gate').classList.remove('show');};

/* ============ BOOT ============ */
render(true);
if(S.gate!==GATE_V)showGate();
startGeo();
netStart();
</script>
</body>
</html>
